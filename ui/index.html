<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ducky Bounce</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1b26; color: #c0caf5; font-family: system-ui, sans-serif; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    header { padding: 10px 14px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #30334a; }
    header strong { color: #7aa2f7; }
    canvas { flex: 1; width: 100%; display: block; background: #16161e; cursor: crosshair; }
    .hint { font-size: 12px; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <strong>Ducky Bounce</strong>
      <span id="score">Score: 0</span>
      <span id="best">Best: 0</span>
      <span class="hint">Click / tap to bounce · high score saved via plugin bridge</span>
    </header>
    <canvas id="c"></canvas>
  </div>
  <script>
    const CHANNEL = "uefn-plugin-ui";
    function call(method, params) {
      const id = crypto.randomUUID();
      return new Promise((resolve, reject) => {
        function onMsg(ev) {
          const d = ev.data;
          if (!d || d.channel !== CHANNEL || d.id !== id) return;
          window.removeEventListener("message", onMsg);
          if (d.ok) resolve(d.result);
          else reject(new Error(d.error || "bridge error"));
        }
        window.addEventListener("message", onMsg);
        parent.postMessage({ channel: CHANNEL, id, method, params: params || {} }, "*");
        setTimeout(() => { window.removeEventListener("message", onMsg); reject(new Error("timeout")); }, 4000);
      });
    }

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");

    let W = 0, H = 0, score = 0, best = 0;
    let x = 80, y = 80, vx = 2.2, vy = 0, r = 18;
    const g = 0.35;

    function resize() {
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width = W * devicePixelRatio;
      canvas.height = H * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    function bounce() {
      vy = -9;
      score += 1;
      scoreEl.textContent = "Score: " + score;
      if (score > best) {
        best = score;
        bestEl.textContent = "Best: " + best;
        call("prefs.set", { id: "highScore", value: best }).catch(() => {});
      }
    }
    canvas.addEventListener("pointerdown", bounce);

    function tick() {
      vy += g;
      x += vx;
      y += vy;
      if (x < r || x > W - r) { vx *= -1; x = Math.max(r, Math.min(W - r, x)); }
      if (y > H - r) {
        y = H - r;
        vy = 0;
        if (score) {
          score = 0;
          scoreEl.textContent = "Score: 0";
        }
      }
      if (y < r) { y = r; vy = Math.abs(vy); }

      ctx.clearRect(0, 0, W, H);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = "#e0af68";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + 6, y - 4, 3, 0, Math.PI * 2);
      ctx.fillStyle = "#1a1b26";
      ctx.fill();
      requestAnimationFrame(tick);
    }

    call("prefs.get", { id: "highScore" })
      .then((res) => {
        const v = typeof res?.value === "number" ? res.value : 0;
        best = v;
        bestEl.textContent = "Best: " + best;
      })
      .catch(() => {})
      .finally(() => tick());
  </script>
</body>
</html>
